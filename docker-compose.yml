services:
  mysql:
    image: mysql:8.0
    container_name: gold_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gold_certificates
      MYSQL_USER: gold
      MYSQL_PASSWORD: gold123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gold_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gold_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: "Gold Certificate Verification"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_BRAND_NAME: "TAJ JEWELRY"
      APP_BRAND_NAME_AR: "تاج للمجوهرات"
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: gold_certificates
      DB_USERNAME: gold
      DB_PASSWORD: gold123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gold_network

  nginx:
    image: nginx:alpine
    container_name: gold_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - gold_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gold_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080/api
      VITE_APP_URL: http://localhost:5173
      VITE_BRAND_NAME: "TAJ JEWELRY"
      VITE_BRAND_NAME_AR: "تاج للمجوهرات"
    depends_on:
      - nginx
    networks:
      - gold_network

volumes:
  mysql_data:

networks:
  gold_network:
    driver: bridge
