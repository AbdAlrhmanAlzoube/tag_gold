# Taj Jewelry — Frontend + Backend
# Path: /etc/nginx/conf.d/taj-jewelry.conf

# ---------- Frontend HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name taj-jeweiry.abdulrahem-alzoubi.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html/tag_gold/frontend/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Frontend HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name taj-jeweiry.abdulrahem-alzoubi.cloud;

    ssl_certificate /etc/letsencrypt/live/taj-jeweiry.abdulrahem-alzoubi.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taj-jeweiry.abdulrahem-alzoubi.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html/tag_gold/frontend/dist;
    index index.html;
    client_max_body_size 20M;

    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass unix:/var/opt/remi/php84/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/tag_gold/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/tag_gold/backend/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/taj-jewelry-front.access.log;
    error_log  /var/log/nginx/taj-jewelry-front.error.log;
}

# ---------- Backend HTTP ----------
server {
    listen 80;
    listen [::]:80;
    server_name back.taj-jeweiry.abdulrahem-alzoubi.cloud;

    root /var/www/html/tag_gold/backend/public;
    index index.php;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/opt/remi/php84/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/taj-jewelry-back.access.log;
    error_log  /var/log/nginx/taj-jewelry-back.error.log;
}
