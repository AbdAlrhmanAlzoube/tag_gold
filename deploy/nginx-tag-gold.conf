# Gold certificates — gold.abdulrahem-alzoubi.cloud
# Path: /etc/nginx/conf.d/tag-gold.conf

server {
    listen 80;
    listen [::]:80;
    server_name gold.abdulrahem-alzoubi.cloud;

    root /var/www/html/tag_gold/frontend/dist;
    index index.html;

    client_max_body_size 20M;

    # Laravel API — نفس PHP 8.4 المستخدم في gentech
    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass unix:/var/opt/remi/php84/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/tag_gold/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/tag_gold/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass unix:/var/opt/remi/php84/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/tag_gold/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/tag_gold/backend/public;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/tag-gold.access.log;
    error_log  /var/log/nginx/tag-gold.error.log;
}
