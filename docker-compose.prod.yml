services:
  mysql:
    image: mysql:8.0
    container_name: gold_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gold_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "3306"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: gold_backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: "3306"
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
    volumes:
      - backend_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gold_network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_APP_URL: ${APP_URL}
        VITE_BRAND_NAME: ${APP_BRAND_NAME:-TAJ JEWELRY}
        VITE_BRAND_NAME_AR: ${APP_BRAND_NAME_AR:-تاج للمجوهرات}
    container_name: gold_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gold_network

volumes:
  mysql_data:
  backend_storage:

networks:
  gold_network:
    driver: bridge
